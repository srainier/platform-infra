[project]
name = "platform-infra"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pulumi>=3,<4",
    "pulumi-digitalocean>=4",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
